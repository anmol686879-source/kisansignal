services:
  - type: web
    name: kisansignal
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: REQUIRE_DATABASE_URL, value: "true" }
      - { key: DATABASE_URL, sync: false }
      - { key: OTP_SECRET, generateValue: true }
      - { key: SMS_PROVIDER, value: twilio }
      - { key: TRUST_PROXY, value: "true" }
      - { key: TWILIO_ACCOUNT_SID, sync: false }
      - { key: TWILIO_AUTH_TOKEN, sync: false }
      - { key: TWILIO_FROM, sync: false }
      - { key: TWILIO_MESSAGING_SERVICE_SID, sync: false }
